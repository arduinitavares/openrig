version: "0.2"
name: starter
summary: >
  A Codex Sol 6.1 Ultra builder and an OMP Claude Opus 5.5 Medium reviewer in your repository. Give the builder one bounded change; follow the durable result and
  continue at the same address. See docs/reference/getting-started.md.

culture_file: CULTURE.md

pods:
  - id: dev
    label: Project
    members:
      - id: build
        agent_ref: "local:../../../agents/development/implementer"
        runtime: codex
        model: gpt-6.1-sol
        effort: ultra
        profile: default
        cwd: "."
        startup:
          files:
            - path: guidance/lead-first-move.md
              delivery_hint: send_text
              required: true
      - id: review
        agent_ref: "local:../../../agents/development/qa"
        runtime: omp
        model: "google-antigravity/claude-opus-5-5:medium"
        profile: default
        cwd: "."
    edges:
      - kind: delegates_to
        from: build
        to: review

edges: []
