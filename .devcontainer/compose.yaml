name: openrig-source-dev

services:
  openrig:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CODEX_VERSION: "0.162.1"
    init: true
    working_dir: /workspace/repos/openrig
    environment:
      HOME: /home/node
      CODEX_HOME: /home/node/.codex
      OPENRIG_HOME: /home/node/.openrig
    command: ["sleep", "infinity"]
    volumes:
      - type: bind
        source: ..
        target: /workspace/repos/openrig
      - type: volume
        source: node_modules
        target: /workspace/repos/openrig/node_modules
      - type: volume
        source: ui_node_modules
        target: /workspace/repos/openrig/packages/ui/node_modules
      - type: volume
        source: retained_home
        target: /home/node

volumes:
  node_modules:
  ui_node_modules:
  retained_home:
    external: true
    name: openrig-docker_home
